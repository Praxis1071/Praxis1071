<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Praxis1071 — Arch Linux and security</title>
  <desc id="desc">An animated dark terminal-inspired banner with blue circuitry, scanning lines and a security-focused identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".55" stop-color="#071426"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0ea5e9" stop-opacity="0"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#0369a1" stop-opacity=".34"/><stop offset="1" stop-color="#020617" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#38bdf8" stroke-opacity=".10" stroke-width="1"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <ellipse cx="900" cy="170" rx="370" ry="220" fill="url(#glow)"/>
  <g fill="none" stroke="#0ea5e9" stroke-opacity=".38" stroke-width="1.4">
    <path d="M0 70H190L225 105H360M840 0V56L890 106H1200M0 290H155L195 250H300M930 360V305L980 255H1200"/>
    <path d="M710 0V35L750 75H840M1200 190H1080L1030 240H960"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="190" cy="70" r="3"/><circle cx="840" cy="56" r="3"/><circle cx="155" cy="290" r="3"/><circle cx="930" cy="305" r="3"/>
  </g>
  <g opacity=".22" fill="#7dd3fc" font-family="monospace" font-size="13">
    <text x="835" y="72">01001000 01000001 01000011 01001011</text>
    <text x="865" y="94">0x7F 0x45 0x4C 0x46  // ELF</text>
    <text x="875" y="286">[ SYSTEM: READY ]</text>
    <text x="55" y="325">/usr/bin/security-lab</text>
  </g>
  <g transform="translate(1010 180)" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".55">
    <circle r="100" stroke-dasharray="3 10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/></circle>
    <circle r="76" stroke-dasharray="34 16"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/></circle>
    <circle r="49" stroke="#2563eb" stroke-opacity=".7"/>
    <path d="M-125 0H125M0 -125V125" stroke-opacity=".28"/>
  </g>
  <g fill="#38bdf8" opacity=".7" font-family="monospace" font-size="12">
    <text x="920" y="55">ARCH // LINUX</text><text x="1060" y="310">SECURITY</text>
  </g>
  <rect x="0" y="0" width="1200" height="3" fill="url(#edge)"/>
  <rect x="0" y="357" width="1200" height="3" fill="url(#edge)"/>
  <rect x="-120" y="0" width="95" height="360" fill="#38bdf8" opacity=".045" filter="url(#soft)"><animate attributeName="x" from="-150" to="1250" dur="9s" repeatCount="indefinite"/></rect>
  <path d="M0 0H1200V360H0Z" fill="none" stroke="#38bdf8" stroke-opacity=".35"/>
  <g font-family="monospace">
    <text x="74" y="130" fill="#7dd3fc" font-size="17" letter-spacing="5">LINUX • SECURITY • OPEN SOURCE</text>
    <text x="70" y="205" fill="#f8fafc" font-size="68" font-weight="700" letter-spacing="2">PRAXIS1071</text>
    <text x="74" y="246" fill="#38bdf8" font-size="21" letter-spacing="1">Turning knowledge into practice.</text>
    <text x="74" y="292" fill="#64748b" font-size="14">[ ARCH-BASED LINUX USER ]  [ BUILD • TEST • LEARN ]</text>
  </g>
  <rect x="70" y="310" width="330" height="2" fill="#0c4a6e"/><rect x="70" y="310" width="65" height="2" fill="#38bdf8"><animate attributeName="x" values="70;335;70" dur="4s" repeatCount="indefinite"/></rect>
</svg>