<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="title">
  <title id="title">Praxis1071 animated terminal panel</title>
  <rect x="1" y="1" width="1098" height="218" rx="14" fill="#030712" stroke="#164e63" stroke-width="2"/>
  <path d="M1 43H1099" stroke="#164e63"/>
  <circle cx="25" cy="22" r="6" fill="#ef4444"/><circle cx="47" cy="22" r="6" fill="#eab308"/><circle cx="69" cy="22" r="6" fill="#22c55e"/>
  <text x="550" y="27" fill="#64748b" font-family="monospace" font-size="13" text-anchor="middle">praxis1071@archlinux: ~</text>
  <g font-family="monospace" font-size="17">
    <text x="30" y="82" fill="#38bdf8">$</text><text x="52" y="82" fill="#e2e8f0">uname -o</text><text x="190" y="82" fill="#94a3b8">→ GNU/Linux</text>
    <text x="30" y="119" fill="#38bdf8">$</text><text x="52" y="119" fill="#e2e8f0">cat /etc/os-release</text><text x="270" y="119" fill="#94a3b8">→ Arch-based systems</text>
    <text x="30" y="156" fill="#38bdf8">$</text><text x="52" y="156" fill="#e2e8f0">ls ~/projects</text><text x="190" y="156" fill="#94a3b8">→ BlackArch-Toolset  Keycan  NetFather</text>
    <text x="30" y="193" fill="#38bdf8">$</text><text x="52" y="193" fill="#e2e8f0">echo "Turning knowledge into practice."</text>
    <rect x="470" y="178" width="10" height="19" fill="#38bdf8"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <path d="M1 44H1099" stroke="#0ea5e9" stroke-opacity=".22"/>
</svg>